
#General settings
[general]
	#Use config instead of datapack
	use_config = true

	#List settings
	#Syntax: ["modid:block|weight"]
	#Example: ["minecraft:stone|2","minecraft:dirt|1"]
	#Forge tags are supported
	[general.lists]
		#Basalt gen
		block_list_basalt = ["minecraft:netherrack|100"]
		#Cobble gen
		block_list_cobble = ["minecraft:stone|70", "minecraft:granite|8", "minecraft:diorite|8", "minecraft:andesite|8", "mysticalagriculture:soulstone|6"]
		#Stone gen
		block_list_stone = ["minecraft:stone|70", "minecraft:granite|8", "minecraft:diorite|8", "minecraft:andesite|8", "mysticalagriculture:soulstone|6"]

		#Custom settings
		[general.lists.custom]
			#Custom generators
			#Syntax: [gen]
			#Gen: [type, block, list]
			#Type: cobblestone, stone
			#Block: resource location of the block below the generated block
			#List: see List settings
			#Examples:
			#custom_generators = [
			#   ["cobblestone", "minecraft:diamond_block", ["minecraft:diamond_block"]],
			#   ["cobblestone", "minecraft:dirt", ["forge:dirt"]],
			#   ["cobblestone", "minecraft:white_wool", ["minecraft:wool"]]]
			custom_generators = [["cobblestone", "minecraft:sandstone", ["minecraft:sand|50", "minecraft:red_sand|50"]], ["cobblestone", "kubejs:compressed_smooth_stone", ["minecraft:smooth_stone|80", "minecraft:gravel|20"]]]

